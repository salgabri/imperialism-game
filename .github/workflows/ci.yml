# Every push runs the regression suite, the production build and the headless smoke campaigns.
# On main, a push that passes them is deployed to production by the deploy job, once the Vercel
# secrets exist (README "Deployment"). A newer push cancels the older run, so only the newest commit deploys.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  deploy:
    name: Deploy to production
    needs: test
    if: github.ref == 'refs/heads/main'
    # The Production environment's secrets reach only this job; repository secrets work here too.
    environment:
      name: Production
      url: https://imperialism-game.vercel.app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Without the token nothing deploys from here, and Vercel's own Git deploys stay in charge.
      - name: Check the Vercel token
        id: vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: this job cannot read VERCEL_TOKEN as a Production environment or repository secret (README \"Deployment\")."
          fi
      - if: steps.vercel.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.vercel.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - if: steps.vercel.outputs.ready == 'true'
        run: npm install --global vercel@64.7.0
      # The project is found by name and scope (its deployments' addresses show both), so only the token is secret.
      - if: steps.vercel.outputs.ready == 'true'
        run: vercel link --yes --project imperialism-game --scope wappen-der-schweiz --token="$VERCEL_TOKEN"
      - if: steps.vercel.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.vercel.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: steps.vercel.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
