# Every push runs the regression suite, the production build and the headless smoke campaigns.
# Vercel builds each push to main itself, and its Deployment Checks hold the build back from the live domain
# until this job, "Tests, build and smoke", passes (README "Deployment"). Renaming the job means updating that check.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
